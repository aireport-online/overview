name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Test
        run: swift test

      - name: Build the app
        run: Scripts/build-app.sh

      - name: Launch the app and take screenshots
        run: Scripts/screenshots.sh build/screenshots

      - name: Record the walkthrough
        run: Scripts/walkthrough.sh build/walkthrough

      - name: Zip the app
        run: ditto -c -k --keepParent build/Overview.app build/Overview.zip

      - uses: actions/upload-artifact@v6
        with:
          name: Overview
          path: build/Overview.zip

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: walkthrough
          path: build/walkthrough
          if-no-files-found: ignore
